name: Publish NCAA game details
on:
  workflow_dispatch:
    inputs:
      season:
        description: Season to publish
        required: true
        default: '2026'
      write_files:
        description: Commit generated files (true only after dry run)
        required: true
        default: 'false'
permissions:
  contents: write
concurrency:
  group: ncaa-score-update
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test publisher
        run: python -m unittest discover -s tests -p 'test_publish_game_details.py'
      - name: Publish game details
        run: |
          python publish_game_details.py --season '${{ inputs.season }}' ${{ inputs.write_files == 'true' && '--write' || '' }}
      - name: Commit generated game details
        if: ${{ inputs.write_files == 'true' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/game-details/
          if ! git diff --cached --quiet; then
            git commit -m 'Publish NCAA game details'
            git push
          fi
