name: Test Version 3.0B Incremental Rollover
on:
  push:
    branches:
      - test/version-3-season-rollover
    paths:
      - 'incremental_v30b.py'
      - 'incremental_details_v30b.py'
      - 'tests/test_incremental_v30b.py'
      - '.github/workflows/test-v30b.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run 3.0B tests
        run: python -m unittest discover -s tests -p 'test_incremental_v30b.py' -v
      - name: Verify candidate syntax
        run: python -m py_compile incremental_v30b.py incremental_details_v30b.py
