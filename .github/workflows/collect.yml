
name: Update NCAA scores

on:
  workflow_dispatch:


  schedule:
    # Monday-Wednesday: 6 PM-midnight, every 30 minutes
    - cron: '7,37 18-23 * * 1-3'
      timezone: 'America/New_York'

    # Thursday-Friday: 6-7 PM, every 30 minutes
    - cron: '7,37 18 * * 4,5'
      timezone: 'America/New_York'

    # Thursday-Friday: 7-10 PM, every 10 minutes
    - cron: '7,17,27,37,47,57 19-21 * * 4,5'
      timezone: 'America/New_York'

    # Thursday-Friday: 10 PM-midnight, every 30 minutes
    - cron: '7,37 22-23 * * 4,5'
      timezone: 'America/New_York'

    # Saturday: 10 AM-noon, every 30 minutes
    - cron: '7,37 10-11 * * 6'
      timezone: 'America/New_York'

    # Saturday: noon-midnight, every 10 minutes
    - cron: '7,17,27,37,47,57 12-23 * * 6'
      timezone: 'America/New_York'

    # Sunday: 6 PM-midnight, every 30 minutes
    - cron: '7,37 18-23 * * 0'
      timezone: 'America/New_York'

    # Midnight-2 AM: following day
    - cron: '7,37 0-1 * * 0-2,5,6'
      timezone: 'America/New_York'

      
permissions:
  contents: write

concurrency:
  group: ncaa-score-update
  cancel-in-progress: false


jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect NCAA scoreboard
        run: python collector.py

      - name: Commit live scoreboard feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add public/nc-scores.json public/diagnostics.json

          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA scoreboard feed'
            git push
          fi

      - name: Verify incremental collector
        id: detail_tests
        continue-on-error: true
        run: |
          python -m unittest discover -s tests \
            -p 'test_incremental_details.py'

      - name: Update recent game details
        id: details
        if: steps.detail_tests.outcome == 'success'
        continue-on-error: true
        run: |
          python incremental_details.py \
            --season 2026 \
            --write


      - name: Commit updated game details
        id: detail_commit
        if: steps.details.outcome == 'success'
        continue-on-error: true
        run: |
          git add public/archive/ public/game-details/

          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA game details'
            git push
          fi

      - name: Report detail-enrichment problems
        if: |
          steps.detail_tests.outcome == 'failure' ||
          steps.details.outcome == 'failure' ||
          steps.detail_commit.outcome == 'failure'
        run: |
          echo "::warning::Live scores published; game-detail enrichment or publication needs review."

