
name: Update NCAA scores

on:
  workflow_dispatch:

  schedule:
    # All times in Eastern Time
    - cron: '*/30 18-23 * * 1,2,3,0'
      timezone: 'America/New_York'

    # Thursday and Friday evening games
    - cron: '*/15 18-23 * * 4,5'
      timezone: 'America/New_York'

    # Saturday games
    - cron: '*/15 10-23 * * 6'
      timezone: 'America/New_York'

    # Overnight coverage (midnight-2 AM)
    - cron: '*/30 0-1 * * 0,1,2,3,4'
      timezone: 'America/New_York'

    # Overnight after Thursday, Friday, Saturday
    - cron: '*/15 0-1 * * 5,6,0'
      timezone: 'America/New_York'
permissions:
  contents: write

concurrency:
  group: ncaa-score-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect scoreboard
        run: python collector.py

      - name: Commit updated public feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nc-scores.json public/diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA scoreboard feed'
            git push
          fi
