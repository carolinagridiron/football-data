name: Update Carolina Gridiron NCAA Data
on:
  workflow_dispatch:
  schedule:
    # August-November: all days, 10 AM-2 AM Eastern, every 30 minutes.
    - cron: '7,37 10-23 * 8-11 *'
      timezone: 'America/New_York'
    - cron: '7,37 0-1 * 8-11 *'
      timezone: 'America/New_York'
    # December-January: all days, 10 AM-2 AM Eastern, every 10 minutes.
    - cron: '7,17,27,37,47,57 10-23 * 12,1 *'
      timezone: 'America/New_York'
    - cron: '7,17,27,37,47,57 0-1 * 12,1 *'
      timezone: 'America/New_York'
permissions:
  contents: write
concurrency:
  group: ncaa-score-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect all NCAA divisions once and build three feeds
        run: python unified_ncaa.py --write
      - name: Read collection status
        id: status
        run: |
          python - <<'PYCODE'
          import json,os
          from pathlib import Path
          s=json.loads(Path('build/unified-status.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('active='+('true' if s['mode']=='collect' else 'false'),file=f)
          PYCODE
      - name: Publish scoreboard and national feeds
        if: steps.status.outputs.active == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nc-scores.json public/diagnostics.json public/national-fbs.json public/bowl-candidates.json
          if [ -d public/national-fbs-archive ]; then git add -A public/national-fbs-archive/; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update unified NCAA scoreboard feeds'
            git push
          fi
      - name: Enrich recent game details
        id: details
        if: steps.status.outputs.active == 'true'
        continue-on-error: true
        run: python incremental_v30b.py --write
      - name: Publish game details
        if: steps.details.outcome == 'success'
        continue-on-error: true
        run: |
          git add public/archive/ public/game-details/
          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA game details'
            git push
          fi
      - name: Report detail errors
        if: steps.details.outcome == 'failure'
        run: echo '::warning::Score feeds published; detail enrichment needs review.'
