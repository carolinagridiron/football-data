
name: Update NCAA scores

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * 4,5,6,0,1'

permissions:
  contents: write

concurrency:
  group: ncaa-score-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect scoreboard
        run: python collector.py

      - name: Commit updated public feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nc-scores.json public/diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA scoreboard feed'
            git push
          fi
