
name: Update NCAA scores

on:
  workflow_dispatch:


  schedule:
    # Monday-Wednesday: 6 PM-midnight, every 30 minutes
    - cron: '7,37 18-23 * * 1-3'
      timezone: 'America/New_York'

    # Thursday-Friday: 6-7 PM, every 30 minutes
    - cron: '7,37 18 * * 4,5'
      timezone: 'America/New_York'

    # Thursday-Friday: 7-10 PM, every 10 minutes
    - cron: '7,17,27,37,47,57 19-21 * * 4,5'
      timezone: 'America/New_York'

    # Thursday-Friday: 10 PM-midnight, every 30 minutes
    - cron: '7,37 22-23 * * 4,5'
      timezone: 'America/New_York'

    # Saturday: 10 AM-noon, every 30 minutes
    - cron: '7,37 10-11 * * 6'
      timezone: 'America/New_York'

    # Saturday: noon-midnight, every 10 minutes
    - cron: '7,17,27,37,47,57 12-23 * * 6'
      timezone: 'America/New_York'

    # Sunday: 6 PM-midnight, every 30 minutes
    - cron: '7,37 18-23 * * 0'
      timezone: 'America/New_York'

    # Midnight-2 AM: following day
    - cron: '7,37 0-1 * * 0-2,5,6'
      timezone: 'America/New_York'

      
permissions:
  contents: write

concurrency:
  group: ncaa-score-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Collect scoreboard
        run: python collector.py

      - name: Commit updated public feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/nc-scores.json public/diagnostics.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update NCAA scoreboard feed'
            git push
          fi
