name: Test Version 3 Release Candidate
on:
  push:
    branches: ['test/version-3-season-rollover']
    paths:
      - 'v3_pipeline.py'
      - 'season_runtime.py'
      - 'season_policy.py'
      - 'collector_v30a.py'
      - 'incremental_v30b.py'
      - 'incremental_details_v30b.py'
      - 'config_v3.json'
      - 'tests/test_v3_pipeline.py'
      - '.github/workflows/test-v3-release.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run candidate regression tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s tests -p 'test_v3_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_v3_integrated.py' -v
          python -m unittest discover -s tests -p 'test_season.py' -v
          python -m unittest discover -s tests -p 'test_incremental_v30b.py' -v
      - name: Check candidate syntax
        run: python -m py_compile v3_pipeline.py run_v3.py collector_v30a.py incremental_v30b.py
      - name: Verify offline offseason simulation
        run: python v3_pipeline.py --date 2027-06-15
