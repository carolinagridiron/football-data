name: Test V3 Production Compatibility
on:
  push:
    branches: ['test/version-3-season-rollover']
    paths:
      - 'v3_score_stage.py'
      - 'tests/test_v3_production.py'
      - '.github/workflows/test-v3-production-compatibility.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run production compatibility tests (offline)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p 'test_v3_production.py' -v
      - name: Check candidate syntax
        run: python -m py_compile v3_score_stage.py run_v3.py collector_v30a.py incremental_v30b.py
      - name: Verify protected files unchanged
        run: |
          git diff --exit-code -- public/nc-scores.json public/diagnostics.json
