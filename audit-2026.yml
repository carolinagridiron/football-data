name: Audit 2026 NCAA scores

on:
  workflow_dispatch:
    inputs:
      through_week:
        description: 'Last NCAA football week to check (0-22); use 13 for initial test'
        required: true
        default: '13'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run read-only season comparison
        run: python audit.py --season 2026 --through-week "${{ inputs.through_week }}"
      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: carolina-gridiron-2026-audit
          path: audit-results/
          retention-days: 30
